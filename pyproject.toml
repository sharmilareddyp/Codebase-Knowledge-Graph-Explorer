[project]
name = "codebase-kg"
version = "0.1.0"
description = "Index local Python repositories into a Neo4j knowledge graph and explore them through a REST API and grounded Q&A."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "neo4j>=5.26,<7",
    "langchain>=0.3,<1",
    "langchain-core>=0.3,<1",
    "langchain-openai>=0.2,<1",
    "openai>=1.50,<2",
    "pathspec>=0.12.1,<1",
    "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "httpx>=0.27,<1",
]

[project.scripts]
ckg = "codebase_kg.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["codebase_kg*"]

[tool.vercel]
entrypoint = "app:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires a reachable Neo4j instance or OpenAI API (deselected by default)",
]
addopts = "-m 'not integration'"
