services:
  neo4j:
    image: neo4j:5.26
    container_name: ckg-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/please-change-me
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p please-change-me 'RETURN 1'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  neo4j_data:
